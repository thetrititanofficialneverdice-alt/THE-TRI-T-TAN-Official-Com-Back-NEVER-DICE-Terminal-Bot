 }

 if(cmd==="All_exe"){allMode=true;allIndex=0;addMessage(d.allStart+"\n"+(lang==="uk"?"Перша команда: ":lang==="ru"?"Первая команда: ":"Першая каманда: ")+commands[0]);return;}
 if(Object.prototype.hasOwnProperty.call(d.responses,cmd)){addMessage(d.responses[cmd]);return;}
 const random=commands[Math.floor(Math.random()*commands.length)];addMessage(d.unknown+random);
}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>setLanguage(b.dataset.lang)));
function sendCommand(){
 const input=$("command");
 const value=input.value;
 if(!value.trim()) return;
 handleCommand(value);
 input.value="";
 input.focus();
}
$("form").addEventListener("submit",e=>{e.preventDefault();sendCommand();});
$("command").addEventListener("keydown",e=>{
 if(e.key==="Enter" && !e.isComposing){
   e.preventDefault();
   sendCommand();
 }
});
$("send").addEventListener("click",e=>{e.preventDefault();sendCommand();});
setLanguage("uk");
</script>
</body>
